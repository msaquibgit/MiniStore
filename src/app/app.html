<div class="min-vh-100 d-flex flex-column">
  <nav class="navbar navbar-expand-lg bg-dark navbar-dark stick-top shadow-sm">
    <div class="container">
      <a class="navbar-brand fw-semibold" routerLink="/products">MiniStore</a>
      <button
        class="navbar-toggler"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#nav"
        aria-controls="#nav"
        aria-expanded="false"
        aria-label="Toggle navigation"
      >
        <span class="navbar-toggler-icon"></span>
      </button>
      <div id="nav" class="collapse navbar-collapse">
        <ul class="navbar-nav me-auto">
          <li class="nav-item">
            <a class="nav-link" routerLink="/products" routerLinkActive="active">Products</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" routerLink="/cart" routerLinkActive="active">
              Cart <span class="badge bg-warning text-dark ms-1">{{ cartCount() }}</span>
            </a>
          </li>
        </ul>
        <div class="">
          @if (isLoggedIn()) {
            <span class="text-light small">Hi, {{ customerName() }}</span>
            <button class="btn btn-outline-light btn-sm" (click)="logout()">Logout</button>
          } @else {
            <a class="btn btn-outline-light btn-sm" routerLink="/login"> Login </a>
          }
        </div>
      </div>
    </div>
  </nav>
  <main class="flex-grow-1">
    <div class="container my-4">
      <router-outlet></router-outlet>
    </div>
  </main>
  <footer class="bg-dark text-light border-top border-secondary">
    <div
      class="container py-3 d-flex flex-column flex-md-row justify-content-between align-item-center gap-2"
    >
      <div class="small">© {{ currentYear }} MiniStore. All rights reserved.</div>
      <div class="d-flex gap-3 small">
        <a class="text-light text-decoration-none" routerLink="/products">Products</a>
        <a class="text-light text-decoration-none" routerLink="/cart">Cart</a>
        <a class="text-light text-decoration-none" routerLink="/login">Login</a>
      </div>
    </div>
  </footer>
</div>
